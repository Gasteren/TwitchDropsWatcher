name: Upload to CurseForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip
        run: |
          mkdir TwitchDropsWatcher
          cp *.lua *.toc TwitchDropsWatcher/
          cp -r images libs icons TwitchDropsWatcher/
          zip -r TwitchDropsWatcher.zip TwitchDropsWatcher

      # The commit message becomes the CurseForge changelog, without the Co-authored-by line.
      - name: Changelog from the commit message
        id: changelog
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          text=$(printf '%s\n' "$MESSAGE" | grep -viE '^(co-authored-by|signed-off-by):' || true)
          if [ -z "$text" ]; then
            text="Manual release"
          fi
          printf '%s\n' "$text"
          {
            echo "text<<CHANGELOG_EOF"
            printf '%s\n' "$text"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@13f278adc4cc7b881555f87e6ea528387dd6492b # v3 (v3.1.0)
        with:
          token: "${{ secrets.TWITCHDROPSWATCHER }}"
          project_id: "1310016"
          game_endpoint: "wow"
          file_path: "TwitchDropsWatcher.zip"
          game_versions: "12.1.5,1.60.1"
          release_type: "release"
          display_name: "TwitchDropsWatcher - ${{ github.event.head_commit.timestamp || github.sha }}"
          changelog: "${{ steps.changelog.outputs.text }}"
          changelog_type: "markdown"